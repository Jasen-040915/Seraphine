name: Test and build free Seraphine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-plus.txt
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-plus.txt
      - name: Download verified speech model
        run: .\.venv\Scripts\python.exe scripts\download_voice_model.py
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          APPDATA: ${{ runner.temp }}\SeraphineTest
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests
      - name: Build Windows bundle
        run: .\build-plus.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Seraphine-free-windows-x64
          path: dist/Seraphine/
